services:
  - type: web
    name: crytofuria-phantom-dapp
    runtime: node
    plan: free
    rootDir: dapp
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: TELEGRAM_BOT_TOKEN
        sync: false
